<style>

    color-scheme: light;
    --bg:#eef1f6; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;

    --red:#dc2626; --red-soft:#fef2f2; --amber:#d97706; --amber-soft:#fff7ed;
    --green:#16a34a; --green-soft:#f0fdf4; --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 18px 80px;}

  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:9px;}

  .sync.saving{color:#92560a;background:#fff7ed;border-color:#fed7aa;}
  .sync.err{color:#991b1b;background:#fef2f2;border-color:#fecaca;}
  .sync .pip{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .sync.saving .pip{animation:pulse 1s infinite;}

  @media(max-width:760px){ .kpis{grid-template-columns:repeat(3,1fr)} .grid2{grid-template-columns:1fr} .right{min-width:74px} }

<!-- ==== Live-site bridge: passcode gate + HubSpot proxy shim (added for public Vercel hosting) ==== -->
<style>
  #gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
    background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #gate .card{background:#fff;color:#0f172a;padding:26px 24px;border-radius:16px;width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center;}
  #gate h1{font-size:17px;margin:0 0 4px;font-weight:800;}
  #gate p{font-size:12.5px;color:#64748b;margin:0 0 16px;}
  #gate input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;
    margin-bottom:10px;box-sizing:border-box;}
  #gate button{width:100%;padding:10px;border:0;border-radius:10px;background:#4f46e5;color:#fff;
    font-weight:700;font-size:14px;cursor:pointer;}
  #gate button:disabled{opacity:.6;cursor:default;}
  #gate .err{color:#dc2626;font-size:12px;min-height:15px;margin-bottom:6px;}
</style>
<script>
(function(){
  var KEY="smartboard.pass";
  function getPass(){ try{return localStorage.getItem(KEY)||"";}catch(e){return "";} }
  function setPass(v){ try{localStorage.setItem(KEY,v);}catch(e){} }
  function clearPass(){ try{localStorage.removeItem(KEY);}catch(e){} }

  function showGate(msg){
    var g=document.getElementById("gate");
    if(g){ if(msg){var ee=g.querySelector(".err"); if(ee) ee.textContent=msg;} return; }
    g=document.createElement("div"); g.id="gate";
    g.innerHTML='<div class="card"><h1>Smart Board</h1>'
      +'<p>Enter the passcode to view the live board.</p>'
      +'<div class="err">'+(msg||"")+'</div>'
      +'<input id="gpass" type="password" placeholder="Passcode" autocomplete="off">'
      +'<button id="gbtn">Unlock</button></div>';
    (document.body||document.documentElement).appendChild(g);
    var inp=g.querySelector("#gpass"), btn=g.querySelector("#gbtn"), err=g.querySelector(".err");
    function submit(){
      var v=inp.value||"";
      if(!v){ err.textContent="Enter a passcode"; return; }
      btn.disabled=true; err.textContent="Checking…";
      fetch("/api/hs",{method:"POST",headers:{"content-type":"application/json","x-board-pass":v},
        body:JSON.stringify({tool:"ping"})})
        .then(function(r){
          if(r.status===200){ setPass(v); location.reload(); return; }
          btn.disabled=false;
          if(r.status===401) err.textContent="Wrong passcode";
          else if(r.status===404) err.textContent="No backend here — open the live site URL, not the local file";
          else err.textContent="Server error ("+r.status+") — check BOARD_PASSCODE is set";
        })
        .catch(function(){ btn.disabled=false; err.textContent="Can't reach the server — open the live site URL"; });
    }
    btn.onclick=submit;
    inp.onkeydown=function(e){ if(e.key==="Enter") submit(); };
    setTimeout(function(){ inp.focus(); },50);
  }
  function gateWhenReady(msg){
    if(document.body) showGate(msg);
    else document.addEventListener("DOMContentLoaded",function(){showGate(msg);});
  }

  // The board calls window.cowork.callMcpTool exactly as it did inside Cowork.
  // Here we route every call to our own /api/hs proxy, which holds the HubSpot token.
  window.cowork = window.cowork || {};
  window.cowork.callMcpTool = function(tool, args){
    var pass=getPass();
    if(!pass){ gateWhenReady(); return Promise.resolve({isError:true, content:[{type:"text",text:"Locked"}]}); }
    return fetch("/api/hs",{method:"POST",
      headers:{"content-type":"application/json","x-board-pass":pass},
      body:JSON.stringify({tool:tool,args:args})})
      .then(function(r){
        if(r.status===401){ clearPass(); gateWhenReady("Session expired — enter the passcode");
          return {isError:true, content:[{type:"text",text:"Unauthorized"}]}; }
        return r.json();
      });
  };

  if(!getPass()) gateWhenReady();
})();
</script>

  function pullContent(s){

      try{ const j=JSON.parse(t);

        if(Array.isArray(j)&&j[0]&&typeof j[0].content==="string") return j[0].content;

  function extractText(r){

    if(r.content&&Array.isArray(r.content)){ r.content.forEach(c=>{ if(c&&typeof c.text==="string") raw.push(c.text); }); }
    const resolved=raw.map(pullContent).filter(Boolean);
    for(const c of resolved){ if(c.indexOf("Dataset TSV:")!==-1 && /Dataset TSV:\s*\n/.test(c)) return c; }

  }

  function parseDataset(text){

    lines=lines.filter(s=>!/^Showing\s+\d+\s+of\s+\d+/i.test(s.trim()));
    if(!lines.length) return {headers:[],rows:[]};

  }

  let TICKETS=[], TMAP={}, ownerName="Raj Kumar", updatedAt="", detailsCache={}, pendingAdds={};
  // Keep just-added tasks visible until HubSpot's search index catches up (it lags a bit for

  function mergePending(t){
    const pend=pendingAdds[t.id]; if(!pend||!pend.length) return;
    const ids=new Set(t.tasks.map(x=>String(x.id)).filter(Boolean));
    const titles=t.tasks.map(x=>x.title);
    const keep=[];
    pend.forEach(p=>{
      const known = p.id ? ids.has(String(p.id)) : titles.indexOf(p.title)>-1;
      if(known) return;                          // server now returns it -> stop pinning
      if(Date.now()-p.addedAt > 300000) return;  // safety expiry (5 min)
      t.tasks.push({id:p.id,title:p.title,done:p.done,due:p.due}); keep.push(p);

  function recompute(t){

    t.score = (PRI[t.pri]?PRI[t.pri].w:0)*100

  async function callQuery(sql){

  async function load(silent){

  function parseTickets(text){
    const {headers,rows}=parseDataset(text); if(!headers.length) return [];
    const c={id:idxOf(headers,"[hs_object_id]"),sub:idxOf(headers,"[subject]"),pri:idxOf(headers,"[hs_ticket_priority]"),
      stg:idxOf(headers,"[hs_pipeline_stage]"),cr:idxOf(headers,"[createdate]"),cl:idxOf(headers,"[closed_date]"),
      na:idxOf(headers,"[hs_nextactivitydate]"),deal:idxOf(headers,"[dealname]"),tt:idxOf(headers,"[ticket_type]")};
    const today=todayStr();
    return rows.filter(r=>r[c.id]).map(r=>{
      const t={
        id:(r[c.id]||"").trim(),
        subject:cleanVal(r[c.sub])||"(no subject)",
        hotel:cleanVal(r[c.deal]),
        stage:parenCode(r[c.stg])||"1",
        pri:parenCode(r[c.pri])||"NONE",
        target:cleanDate(r[c.cl]),

        nextAct:cleanDate(r[c.na]),

  // Build a ticket from a structured property object (used by the search_crm_objects fallback).
  function ymd(v){ if(v==null||v==="") return null; const d=/^\d+$/.test(String(v))?new Date(Number(v)):new Date(v); return isNaN(d)?null:d.toISOString().slice(0,10); }
  function ticketFromProps(id,p){
    const t={ id:String(id), subject:p.subject||"(no subject)", hotel:null,
      stage:p.hs_pipeline_stage||"1", pri:p.hs_ticket_priority||"NONE",
      target:ymd(p.closed_date), created:ymd(p.createdate), nextAct:ymd(p.hs_nextactivitydate),

  // Single-object ticket read via search (no cross-object daily limit, up to 200 in one call).
  async function searchTickets(){
    const props=["subject","hs_ticket_priority","hs_pipeline_stage","createdate","closed_date","hs_lastmodifieddate","hs_nextactivitydate","ticket_type"];
    const r=await window.cowork.callMcpTool(STOOL,{objectType:"tickets",filterGroups:[{filters:[{propertyName:"hubspot_owner_id",operator:"EQ",value:OWNER}]}],properties:props,limit:200,chatInsights:{userIntent:"Load my tickets for the board",satisfaction:"NEUTRAL"}});

  function parseTasks(text,ticketIds){
    const {headers,rows}=parseDataset(text); const out={};
    if(!headers.length) return out;
    const idCols=[]; headers.forEach((h,i)=>{ if(h.indexOf("[hs_object_id]")!==-1) idCols.push(i); });
    const cTitle=idxOf(headers,"[hs_task_subject]"), cSt=idxOf(headers,"[hs_task_status]"), cDue=idxOf(headers,"[hs_timestamp]");
    rows.forEach(r=>{
      let tid=null;
      for(let k=0;k<idCols.length;k++){ const v=(r[idCols[k]]||"").trim(); if(ticketIds&&ticketIds.has(v)){ tid=v; break; } }
      if(!tid){ if(ticketIds&&ticketIds.size) return; if(idCols.length) tid=(r[idCols[idCols.length-1]]||"").trim(); }
      if(!tid||tid==="Unassigned") return;
      let taskId=null;
      for(let k=0;k<idCols.length;k++){ const v=(r[idCols[k]]||"").trim(); if(v&&v!==tid&&v!=="Unassigned"){ taskId=v; break; } }
      const st=parenCode(r[cSt])||"NOT_STARTED";
      (out[tid]=out[tid]||[]).push({ id:taskId, title:cleanVal(r[cTitle])||"Task", done:st==="COMPLETED", due:cleanDate(r[cDue]) });

    return out;
  }

  function statusSelect(t){

    return '<span class="ctrl sel"><select data-edit="status" data-id="'+esc(t.id)+'" style="color:'+s.color+';background:'+s.soft+';border-color:'+s.soft+'" title="Change status">'+o+'</select></span>';
  }
  function prioritySelect(t){
    let o=PRI_ORDER.map(k=>'<option value="'+k+'"'+(k===t.pri?' selected':'')+'>'+PRI[k].label+'</option>').join("");
    const p=PRI[t.pri]||PRI.NONE;
    return '<span class="ctrl sel"><select data-edit="priority" data-id="'+esc(t.id)+'" style="color:'+p.color+';background:'+p.soft+';border-color:'+p.soft+'" title="Change priority">'+o+'</select></span>';
  }
  function dateInput(t){
    return '<span class="ctrl"><input type="date" data-edit="target" data-id="'+esc(t.id)+'" value="'+(t.target||"")+'" title="Set target / due date"></span>';

  function typeSelect(t){

  async function setType(t,type){
    const old=t.type; if(type===old) return;
    t.type=type; flashId=t.id; render();
    try{ await doWrite(updateTicketArgs(t.id,{ticket_type:type})); toast(type?("Type → "+type):"Type cleared","ok"); }
    catch(e){ t.type=old; render(); toast("Couldn't update type: "+e.message,"err"); }

  // ----- description + notes, lazy-loaded per ticket and cached across refreshes -----
  function stripHtml(s){ return String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim(); }
  function fmtNoteDate(s){ if(!s) return ""; const d=new Date(s); if(isNaN(d)) return ""; return d.toLocaleDateString([], {month:"short",day:"numeric"})+" "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
  async function loadDetails(id){
    const d=detailsCache[id]||(detailsCache[id]={content:"",notes:[],loaded:false,loading:false});
    if(d.loading) return; d.loading=true; render();
    try{
      const cr=await window.cowork.callMcpTool(GTOOL,{objectType:"tickets",objectIds:[Number(id)],properties:["content"]});
      const co=jsonResult(cr); try{ d.content=(co.objects[0].properties.content)||""; }catch(e){ d.content=""; }
      const nr=await window.cowork.callMcpTool(STOOL,{objectType:"notes",filterGroups:[{associatedWith:[{objectType:"tickets",operator:"EQUAL",objectIdValues:[Number(id)]}]}],properties:["hs_note_body","hs_body_preview","hs_timestamp","hs_createdate"],limit:50,sorts:[{propertyName:"hs_createdate",direction:"DESCENDING"}]});
      const no=jsonResult(nr); const arr=(no&&no.results)||[];
      d.notes=arr.map(x=>{const p=x.properties||{};return {id:String(x.id),body:stripHtml(p.hs_note_body||p.hs_body_preview||""),ts:(p.hs_createdate||p.hs_timestamp||"")};});
    }catch(e){ d.error=String(e&&e.message||e); }
    d.loaded=true; d.loading=false; render();
  }
  async function saveDesc(id,text){
    const d=detailsCache[id]||(detailsCache[id]={content:"",notes:[],loaded:true});
    const old=d.content; d.content=text; flashId=id;
    try{ await doWrite(updateTicketArgs(id,{content:text})); toast("Description saved","ok"); mirrorToDeal(TMAP[id],"Description updated"); }
    catch(e){ d.content=old; render(); toast("Couldn't save description: "+e.message,"err"); }
  }
  async function addNote(id,body){
    body=(body||"").trim(); if(!body) return;
    const d=detailsCache[id]||(detailsCache[id]={content:"",notes:[],loaded:true});
    const tmp={id:null,body:body,ts:new Date().toISOString(),_tmp:true};
    d.notes=[tmp].concat(d.notes||[]); state.openDetails[id]=true; flashId=id; render();
    try{
      const args={createRequest:{objects:[{objectType:"notes",properties:{hs_note_body:body,hs_timestamp:String(Date.now())},associations:[{targetObjectId:Number(id),targetObjectType:"tickets"}]}]},confirmationStatus:"CONFIRMED"};
      const r=await doWrite(args); tmp.id=newIdFrom(r); tmp._tmp=false; render(); toast("Note added","ok"); mirrorToDeal(TMAP[id],"Note added",body);
    }catch(e){ d.notes=(d.notes||[]).filter(n=>n!==tmp); render(); toast("Couldn't add note: "+e.message,"err"); }
  }
  function detailsBlock(t){
    const openD=!!state.openDetails[t.id]; const d=detailsCache[t.id];
    let h='<div class="details"><button class="addbtn dtoggle" data-details="'+esc(t.id)+'">'+(openD?'▾':'▸')+' Description &amp; notes</button>';
    if(openD){
      h+='<div class="dpanel">';
      if(!d||!d.loaded){ h+='<div class="dhint">Loading…</div>'; }
      else {
        h+='<div><div class="dlbl">Description</div>'
          +'<textarea class="desc" data-desc="'+esc(t.id)+'" placeholder="Add a description…">'+esc(d.content||"")+'</textarea>'
          +'<div><button class="dsave" data-descsave="'+esc(t.id)+'">Save description</button></div></div>';
        h+='<div><div class="dlbl">Notes</div>';
        if((d.notes||[]).length){ h+='<div class="notelist">'+d.notes.map(n=>'<div class="note"><div class="nbody">'+esc(n.body)+'</div><div class="nmeta">'+esc(fmtNoteDate(n.ts))+(n._tmp?' · saving…':'')+'</div></div>').join("")+'</div>'; }
        else { h+='<div class="dhint">No notes yet.</div>'; }
        h+='<div class="addnote"><input type="text" placeholder="Write a note…" data-noteinput="'+esc(t.id)+'"><button data-notesave="'+esc(t.id)+'">Add note</button></div>';
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div>';
    return h;
  }

  function ticketRow(t,rank){
    const p=PRI[t.pri]||PRI.NONE;
    const due=fmtDue(t.target);
    const done=t.tasks.filter(x=>x.done).length, total=t.tasks.length;
    const open=!!state.openTasks[t.id];
    let html='<div class="row'+(flashId===t.id?' flash':'')+'" data-row="'+esc(t.id)+'">';
    html+= rank!=null ? '<div class="rank" style="background:'+p.color+'">'+rank+'</div>' : '<div class="pdot" style="background:'+p.color+'"></div>';
    html+='<div class="main">';
    html+='<a class="name" href="'+HS+esc(t.id)+'" target="_blank" rel="noopener">'+esc(t.subject)+'<span class="ext">↗ HubSpot</span></a>';
    html+='<div class="meta">'+(t.hotel?'<span class="hotel">'+esc(t.hotel)+'</span>':'<span style="color:var(--faint)">No linked deal</span>')+'</div>';
    html+='<div class="controls">'+statusSelect(t)+prioritySelect(t)+typeSelect(t)+dateInput(t)+'</div>';
    html+='<div class="prog">';
    if(total>0){
      const pct=Math.round(done/total*100);
      html+='<div class="prog-top"><span class="chev" data-tasks="'+esc(t.id)+'">▾</span>'
        +'<span data-tasks="'+esc(t.id)+'" style="cursor:pointer">Tasks '+done+'/'+total+'</span>'
        +'<span class="prog-bar"><span class="prog-fill" style="width:'+pct+'%"></span></span>'
        +'<button class="addbtn" data-addopen="'+esc(t.id)+'">＋ task</button></div>';
    } else {
      html+='<div class="prog-top"><span style="color:var(--faint)">No tasks</span><button class="addbtn" data-addopen="'+esc(t.id)+'">＋ add task</button></div>';
    }
    html+='<div class="tasks'+(open?' open':'')+'" id="tasks-'+esc(t.id)+'">';
    t.tasks.forEach((x,xi)=>{
      const dd=x.due?fmtDate(x.due):"";
      html+='<div class="task'+(x.done?' done':'')+'">'
        +'<input type="checkbox"'+(x.done?' checked':'')+(x._tmp?' disabled':'')+' data-tt="'+esc(t.id)+'" data-ti="'+xi+'">'
        +'<span class="ttitle'+(x._tmp?'':' tedit')+'" data-tt="'+esc(t.id)+'" data-ti="'+xi+'" title="Click to edit">'+esc(x.title)+'</span>'+(dd?'<span class="tdue">'+dd+'</span>':'')+'</div>';
    });
    html+='</div>';
    html+='<div class="addrow'+(state.openTasks["add_"+t.id]?' open':'')+'" id="add-'+esc(t.id)+'">'
      +'<input type="text" placeholder="New task title…" data-addinput="'+esc(t.id)+'">'
      +'<button data-addsave="'+esc(t.id)+'">Add</button></div>';
    html+='</div>';
    html+=detailsBlock(t);
    html+='</div>';
    html+='<div class="right">';
    if(t.closed){ html+='<span class="due ok">Closed '+(t.target?fmtDate(t.target):"")+'</span>'; }
    else if(due){ html+='<span class="due '+due.cls+'">'+esc(due.txt)+'</span>'; }
    else { html+='<span class="due none">No target date</span>'; }
    if(!t.closed && t.age!=null) html+='<span class="age">'+t.age+'d open</span>';
    html+='</div></div>';
    return html;
  }

  // Groups every PENDING (not-done) task by its name across all open tickets, so
  // you can see which deals/tickets share the same outstanding task and clear them together.
  function taskMatrixHtml(){
    const map={};
    TICKETS.forEach(t=>{
      if(t.closed||!baseMatch(t)) return;
      (t.tasks||[]).forEach(task=>{
        if(task.done) return;
        const title=(task.title||"").trim(); if(!title) return;
        const key=title.toLowerCase();
        (map[key]||(map[key]={title:title,items:[]})).items.push(t);
      });
    });
    const groups=Object.keys(map).map(k=>map[k]).sort((a,b)=>b.items.length-a.items.length||a.title.localeCompare(b.title));
    const openP=state.taskPanelOpen!==false;
    let h='<div class="panel"><div class="panel-h taskpanel-h" data-taskpanel="1"><span class="chev">'+(openP?'▾':'▸')+'</span>🧩<h2>Shared pending tasks</h2><span class="count" style="background:#0891b2">'+groups.length+'</span><span class="hint">Same task pending across deals — tackle in bulk</span></div>';
    if(openP){
      h+='<div class="panel-b">';
      if(!groups.length){ h+='<div class="empty">No pending tasks 🎉</div>'; }
      else{
        groups.forEach(g=>{
          const gk=g.title.toLowerCase(), gopen=!!state.openTaskGroups[gk];
          h+='<div class="tg'+(gopen?' open':'')+'"><div class="tg-h" data-tg="'+esc(gk)+'"><span class="chev">▾</span><span class="tg-name">'+esc(g.title)+'</span><span class="tg-count">'+g.items.length+' deal'+(g.items.length>1?'s':'')+'</span></div><div class="tg-body">';
          h+=g.items.map(t=>{const s=STAGE[t.stage]||STAGE["1"];return '<a class="tg-item" href="'+HS+esc(t.id)+'" target="_blank" rel="noopener"><span class="tg-hotel">'+esc(t.hotel||"—")+'</span><span class="tg-sub">'+esc(t.subject||"")+'</span><span class="tg-stage" style="color:'+s.color+'">'+esc(s.label)+'</span></a>';}).join("");
          h+='</div></div>';
        });
      }
      h+='</div>';
    }
    return h+'</div>';
  }

  function render(){
    const C=document.getElementById("content"); const sy=window.scrollY;
    const open=TICKETS.filter(t=>!t.closed&&baseMatch(t));
    const counts={
      overdue:TICKETS.filter(t=>baseMatch(t)&&t.overdue).length,
      due7:TICKETS.filter(t=>baseMatch(t)&&!t.closed&&t.target&&dayDiff(t.target,todayStr())>=0&&dayDiff(t.target,todayStr())<=7).length,
      actionable:TICKETS.filter(t=>baseMatch(t)&&t.actionable&&!t.closed).length,
      waiting:TICKETS.filter(t=>baseMatch(t)&&t.stage==="2").length,
      open:open.length,
      closed:TICKETS.filter(t=>baseMatch(t)&&t.closed).length
    };
    document.getElementById("sub").innerHTML='Owner <b>'+esc(ownerName)+'</b> · <b>'+TICKETS.length+'</b> tickets · '+counts.open+' open · edit any field below to update HubSpot';

    const tiles=[["overdue","Overdue"],["due7","Due ≤ 7 days"],["actionable","Actionable now"],["waiting","Waiting on customer"],["open","Open total"],["closed","Closed"]];
    let html='<div class="kpis">'+tiles.map(a=>'<div class="kpi'+(state.quick===a[0]?' active':'')+'" data-k="'+a[0]+'"><div class="bar"></div><div class="n">'+counts[a[0]]+'</div><div class="l">'+a[1]+'</div></div>').join("")+'</div>';

    html+='<div class="topfilter"><span class="lab">Filter by type</span>'
      + TYPE.map(k=>'<span class="chip'+(state.type.indexOf(k)>-1?' on':'')+'" data-type="'+esc(k)+'">'+esc(k)+'</span>').join("")
      + (state.type.length?'<span class="chip clearx" data-typeclear="1">✕ clear</span>':'')
      + '</div>';

    html+='<div class="grid2" style="margin-bottom:16px">'
      +'<div class="chartbox"><h3>Open tickets by status</h3><div class="canvas-h"><canvas id="cStatus"></canvas></div></div>'
      +'<div class="chartbox"><h3>Open tickets by priority</h3><div class="canvas-h"><canvas id="cPri"></canvas></div></div></div>';

    html+=taskMatrixHtml();

    const actionable=TICKETS.filter(t=>t.actionable&&!t.closed&&(!state.q||passQ(t))&&(!state.pri.length||state.pri.indexOf(t.pri)>-1)&&(!state.type.length||state.type.indexOf(t.type)>-1)).sort((a,b)=>b.score-a.score);
    const dfOpen=!state.collapsedSec.dofirst;
    html+='<div class="panel"><div class="panel-h sec-h" data-sec="dofirst"><span class="chev">'+(dfOpen?'▾':'▸')+'</span>⭐<h2>Do First — Actionable now</h2><span class="count">'+actionable.length+'</span><span class="hint">Ranked by priority, due date &amp; age</span></div>';
    if(dfOpen){ html+='<div class="panel-b">'+(actionable.length?actionable.map((t,i)=>ticketRow(t,i+1)).join(""):'<div class="empty">Nothing actionable right now 🎉</div>')+'</div>'; }
    html+='</div>';

    const waiting=TICKETS.filter(t=>t.stage==="2"&&(!state.q||passQ(t))&&(!state.pri.length||state.pri.indexOf(t.pri)>-1)&&(!state.type.length||state.type.indexOf(t.type)>-1)).sort((a,b)=>(b.age||0)-(a.age||0));
    const waOpen=!state.collapsedSec.waiting;
    html+='<div class="panel"><div class="panel-h sec-h" data-sec="waiting"><span class="chev">'+(waOpen?'▾':'▸')+'</span>⏳<h2>Follow up — Waiting on customer</h2><span class="count" style="background:#9333ea">'+waiting.length+'</span><span class="hint">Oldest first — nudge these</span></div>';
    if(waOpen){ html+='<div class="panel-b">'+(waiting.length?waiting.map(t=>ticketRow(t,null)).join(""):'<div class="empty">No tickets waiting on customers.</div>')+'</div>'; }
    html+='</div>';

    html+='<div class="panel"><div class="filters">'
      +'<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'
      +'<input id="q" placeholder="Search ticket or hotel…" value="'+esc(state.q)+'"></div>'
      +'<div class="chips"><span class="lab">Show</span>'
        + tiles.map(a=>'<span class="chip'+(state.quick===a[0]?' on':'')+'" data-quick="'+a[0]+'">'+a[1].replace(" total","")+'</span>').join("")
        + '<span class="chip'+(state.quick==="all"?' on':'')+'" data-quick="all">All</span></div>'
      +'<div class="chips"><span class="lab">Priority</span>'
        + PRI_ORDER.map(k=>'<span class="chip'+(state.pri.indexOf(k)>-1?' on':'')+'" data-pri="'+k+'">'+PRI[k].label+'</span>').join("")
      +'</div>'
      +'<div class="chips"><span class="lab">Type</span>'
        + TYPE.map(k=>'<span class="chip'+(state.type.indexOf(k)>-1?' on':'')+'" data-type="'+esc(k)+'">'+esc(k)+'</span>').join("")
      +'</div></div>';

    const filtered=TICKETS.filter(passFilters);
    html+='<div class="panel-b">';
    let any=false;
    STAGE_ORDER.forEach(sid=>{
      const items=filtered.filter(t=>t.stage===sid).sort((a,b)=>b.score-a.score);
      if(!items.length) return; any=true;
      const s=STAGE[sid]; const col=state.collapsed[sid];
      html+='<div class="group'+(col?' collapsed':'')+'" data-g="'+sid+'">'
        +'<div class="group-h" data-gh="'+sid+'"><span class="chev">▾</span><span class="gname" style="color:'+s.color+'">'+s.label+'</span>'
        +'<span class="gcount" style="background:'+s.color+'">'+items.length+'</span></div>'
        +'<div class="group-body">'+items.map(t=>ticketRow(t,null)).join("")+'</div></div>';
    });
    if(!any) html+='<div class="empty">No tickets match these filters.</div>';
    html+='</div></div>';

    C.innerHTML=(degradedMsg?'<div class="notice">⚠ '+esc(degradedMsg)+'</div>':'')+html;
    document.getElementById("foot").innerHTML='Live two-way sync · edits save to HubSpot instantly · auto-refreshes every 30s (or click ↻ Reload) · "Due" = each ticket\'s Close/Target date';
    wire(); drawCharts(open);
    window.scrollTo(0,sy);
    if(flashId){ const id=flashId; flashId=null; setTimeout(()=>{ const el=document.querySelector('.row[data-row="'+cssId(id)+'"]'); if(el) el.classList.remove("flash"); },1200); }
  }
  function cssId(id){ return String(id).replace(/"/g,'\\"'); }

  function passFilters(t){
    switch(state.quick){
      case "overdue": if(!t.overdue) return false; break;
      case "due7": if(!(!t.closed&&t.target&&dayDiff(t.target,todayStr())>=0&&dayDiff(t.target,todayStr())<=7)) return false; break;
      case "actionable": if(!(t.actionable&&!t.closed)) return false; break;
      case "waiting": if(t.stage!=="2") return false; break;
      case "open": if(t.closed) return false; break;
      case "closed": if(!t.closed) return false; break;
    }
    if(state.pri.length && state.pri.indexOf(t.pri)===-1) return false;
    if(state.type.length && state.type.indexOf(t.type)===-1) return false;
    if(state.q && !passQ(t)) return false;
    return true;
  }

  // ---------- charts ----------
  let chS=null,chP=null;
  function drawCharts(open){
    if(typeof Chart==="undefined") return;
    const byS={}; open.forEach(t=>{byS[t.stage]=(byS[t.stage]||0)+1;});
    const sL=[],sD=[],sC=[];
    STAGE_ORDER.filter(s=>s!=="4").forEach(s=>{if(byS[s]){sL.push(STAGE[s].label);sD.push(byS[s]);sC.push(STAGE[s].color);}});
    const byP={}; open.forEach(t=>{byP[t.pri]=(byP[t.pri]||0)+1;});
    const pL=[],pD=[],pC=[];
    PRI_ORDER.forEach(p=>{if(byP[p]){pL.push(PRI[p].label);pD.push(byP[p]);pC.push(PRI[p].color);}});
    const opt={responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right",labels:{boxWidth:10,boxHeight:10,font:{size:11},padding:8,usePointStyle:true}}}};
    if(chS)chS.destroy(); if(chP)chP.destroy();
    const e1=document.getElementById("cStatus"),e2=document.getElementById("cPri");
    if(e1)chS=new Chart(e1,{type:"doughnut",data:{labels:sL,datasets:[{data:sD,backgroundColor:sC,borderWidth:2,borderColor:"#fff"}]},options:opt});
    if(e2)chP=new Chart(e2,{type:"doughnut",data:{labels:pL,datasets:[{data:pD,backgroundColor:pC,borderWidth:2,borderColor:"#fff"}]},options:opt});
  }

  // ---------- events ----------
  function wire(){
    document.querySelectorAll(".kpi").forEach(el=>el.onclick=()=>{const k=el.dataset.k;state.quick=(state.quick===k?"all":k);save();render();});
    document.querySelectorAll("[data-quick]").forEach(el=>el.onclick=()=>{state.quick=el.dataset.quick;save();render();});
    document.querySelectorAll("[data-pri]").forEach(el=>el.onclick=()=>{const k=el.dataset.pri;const i=state.pri.indexOf(k);if(i>-1)state.pri.splice(i,1);else state.pri.push(k);save();render();});
    document.querySelectorAll("[data-type]").forEach(el=>el.onclick=()=>{const k=el.dataset.type;const i=state.type.indexOf(k);if(i>-1)state.type.splice(i,1);else state.type.push(k);save();render();});
    document.querySelectorAll("[data-typeclear]").forEach(el=>el.onclick=()=>{state.type=[];save();render();});
    document.querySelectorAll("[data-taskpanel]").forEach(el=>el.onclick=()=>{state.taskPanelOpen=!(state.taskPanelOpen!==false);save();render();});
    document.querySelectorAll("[data-sec]").forEach(el=>el.onclick=()=>{const k=el.dataset.sec;state.collapsedSec[k]=!state.collapsedSec[k];save();render();});
    document.querySelectorAll("[data-tg]").forEach(el=>el.onclick=()=>{const k=el.dataset.tg;state.openTaskGroups[k]=!state.openTaskGroups[k];save();const n=el.closest(".tg");if(n)n.classList.toggle("open");});
    document.querySelectorAll("[data-gh]").forEach(el=>el.onclick=()=>{const g=el.dataset.gh;state.collapsed[g]=!state.collapsed[g];save();const n=document.querySelector('.group[data-g="'+g+'"]');if(n)n.classList.toggle("collapsed");});
    document.querySelectorAll("[data-tasks]").forEach(el=>el.onclick=()=>{const id=el.dataset.tasks;state.openTasks[id]=!state.openTasks[id];save();const n=document.getElementById("tasks-"+id);if(n)n.classList.toggle("open");});
    document.querySelectorAll('select[data-edit="status"]').forEach(el=>el.onchange=()=>{const t=TMAP[el.dataset.id];if(t)setStage(t,el.value);});
    document.querySelectorAll('select[data-edit="priority"]').forEach(el=>el.onchange=()=>{const t=TMAP[el.dataset.id];if(t)setPriority(t,el.value);});
    document.querySelectorAll('input[data-edit="target"]').forEach(el=>el.onchange=()=>{const t=TMAP[el.dataset.id];if(t)setTarget(t,el.value);});
    document.querySelectorAll('input[data-tt]').forEach(el=>el.onchange=()=>{const t=TMAP[el.dataset.tt];if(t){const tk=t.tasks[+el.dataset.ti];if(tk)toggleTask(t,tk);}});
    document.querySelectorAll('.tedit').forEach(el=>el.onclick=()=>startTaskEdit(el));
    document.querySelectorAll('[data-addopen]').forEach(el=>el.onclick=()=>{const id=el.dataset.addopen;state.openTasks["add_"+id]=!state.openTasks["add_"+id];const n=document.getElementById("add-"+id);if(n){n.classList.toggle("open");const inp=n.querySelector("input");if(inp&&n.classList.contains("open"))inp.focus();}});
    document.querySelectorAll('[data-addsave]').forEach(el=>el.onclick=()=>{const id=el.dataset.addsave;const t=TMAP[id];const n=document.querySelector('input[data-addinput="'+cssId(id)+'"]');if(t&&n){const v=n.value;n.value="";state.openTasks["add_"+id]=false;addTask(t,v);}});
    document.querySelectorAll('input[data-addinput]').forEach(el=>el.onkeydown=(e)=>{if(e.key==="Enter"){const id=el.dataset.addinput;const t=TMAP[id];const v=el.value;el.value="";state.openTasks["add_"+id]=false;if(t)addTask(t,v);}});
    document.querySelectorAll('select[data-edit="type"]').forEach(el=>el.onchange=()=>{const t=TMAP[el.dataset.id];if(t)setType(t,el.value);});
    document.querySelectorAll('[data-details]').forEach(el=>el.onclick=()=>{const id=el.dataset.details;state.openDetails[id]=!state.openDetails[id];save();const dc=detailsCache[id];if(state.openDetails[id]&&(!dc||(!dc.loaded&&!dc.loading)))loadDetails(id);else render();});
    document.querySelectorAll('[data-descsave]').forEach(el=>el.onclick=()=>{const id=el.dataset.descsave;const p=el.closest('.dpanel');const ta=p?p.querySelector('textarea.desc'):document.querySelector('textarea[data-desc="'+cssId(id)+'"]');if(ta)saveDesc(id,ta.value);});
    document.querySelectorAll('[data-notesave]').forEach(el=>el.onclick=()=>{const id=el.dataset.notesave;const p=el.closest('.addnote');const n=p?p.querySelector('input'):document.querySelector('input[data-noteinput="'+cssId(id)+'"]');if(n){const v=n.value;n.value="";addNote(id,v);}});
    document.querySelectorAll('input[data-noteinput]').forEach(el=>el.onkeydown=(e)=>{if(e.key==="Enter"){const id=el.dataset.noteinput;const v=el.value;el.value="";addNote(id,v);}});
    const q=document.getElementById("q");
    if(q){ q.oninput=()=>{state.q=q.value;save();clearTimeout(window.__qd);window.__qd=setTimeout(()=>{render();const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},220);}; }
  }

  // Cache-busted reads (see cb()) make a background refresh return the TRUE current HubSpot
  // state, so auto-sync is safe again. Skip while a save is in flight or a control is focused;
  // load() also discards any refresh that raced with an edit, so edits are never reverted.
  const content=document.getElementById("content");
  content.addEventListener("focusin",e=>{ if(e.target.matches&&e.target.matches("select,input,textarea")) editing=true; });
  content.addEventListener("focusout",()=>{ setTimeout(()=>{editing=false;},300); });
  setInterval(()=>{ if(savingCount>0||editing||document.hidden) return; load(true); }, 30000);
  load();
})();
</script>
</body>
</html>
